<body>
<div id="root"><div id="boot-msg">Carregando…</div></div>
<div id="boot-error"></div>

<script>
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    if (!box) return;
    box.style.display = "block";
    box.textContent = "Deu um erro ao carregar o app:\n" + (e.message || e.error || "erro desconhecido") +
      "\n\nVerifique sua conexão com a internet e recarregue a página. Se persistir, avise para corrigirmos.";
  });
</script>

<script>
  // Armazenamento local no dispositivo — substitui o window.storage do ambiente
  // Claude por localStorage, para o app funcionar sozinho, fora do claude.ai.
  // Guarda os dados só neste navegador/aparelho.
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem("recibo-app:" + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem("recibo-app:" + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem("recibo-app:" + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const p = "recibo-app:" + (prefix || "");
      const keys = Object.keys(localStorage)
        .filter((k) => k.startsWith(p))
        .map((k) => k.slice("recibo-app:".length));
      return { keys, prefix: prefix || null, shared: false };
    },
  };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- helpers ---------- */

const UNIDADES = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove"];
const DEZ_A_DEZENOVE = ["dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const DEZENAS = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CENTENAS = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function tresDigitos(n) {
  if (n === 0) return "";
  if (n === 100) return "cem";
  const c = Math.floor(n / 100);
  const resto = n % 100;
  const partes = [];
  if (c > 0) partes.push(CENTENAS[c]);
  if (resto > 0) {
    if (resto < 10) partes.push(UNIDADES[resto]);
    else if (resto < 20) partes.push(DEZ_A_DEZENOVE[resto - 10]);
    else {
      const d = Math.floor(resto / 10);
      const u = resto % 10;
      partes.push(u > 0 ? `${DEZENAS[d]} e ${UNIDADES[u]}` : DEZENAS[d]);
    }
  }
  return partes.join(" e ");
}

function numeroPorExtenso(num) {
  if (num === 0) return "zero";
  const milhar = Math.floor(num / 1000);
  const resto = num % 1000;
  const partes = [];
  if (milhar > 0) partes.push(milhar === 1 ? "mil" : `${tresDigitos(milhar)} mil`);
  if (resto > 0) partes.push(tresDigitos(resto));
  const juntor = milhar > 0 && resto > 0 && resto < 100 ? " e " : " ";
  return partes.join(juntor);
}

function valorPorExtenso(valor) {
  const inteiro = Math.floor(valor);
  const centavos = Math.round((valor - inteiro) * 100);
  let texto = `${numeroPorExtenso(inteiro)} ${inteiro === 1 ? "real" : "reais"}`;
  if (centavos > 0) {
    texto += ` e ${numeroPorExtenso(centavos)} ${centavos === 1 ? "centavo" : "centavos"}`;
  }
  return texto;
}

function maskCPF(v) {
  v = v.replace(/\D/g, "").slice(0, 11);
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  return v;
}

function centsToBRL(cents) {
  return (cents / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatDatePtBR(isoDate) {
  if (!isoDate) return "";
  const [y, m, d] = isoDate.split("-").map(Number);
  return `${d} de ${MESES[m - 1]} de ${y}`;
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

/* ---------- signature pad ---------- */

function SignaturePad({ initialDataUrl, onSave, ink }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const hasStroke = useRef(false);
  const [empty, setEmpty] = useState(!initialDataUrl);

  const getCtx = () => canvasRef.current.getContext("2d");

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = getCtx();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (initialDataUrl) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = initialDataUrl;
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return {
      x: ((point.clientX - rect.left) / rect.width) * canvasRef.current.width,
      y: ((point.clientY - rect.top) / rect.height) * canvasRef.current.height,
    };
  };

  const start = (e) => {
    if (e.cancelable) e.preventDefault();
    drawing.current = true;
    hasStroke.current = true;
    setEmpty(false);
    const { x, y } = pos(e);
    const ctx = getCtx();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const move = (e) => {
    if (!drawing.current) return;
    if (e.cancelable) e.preventDefault();
    const { x, y } = pos(e);
    const ctx = getCtx();
    ctx.lineTo(x, y);
    ctx.stroke();
  };

  const end = (e) => {
    if (e && e.cancelable) e.preventDefault();
    drawing.current = false;
  };

  // Touch listeners are attached natively (not via React's onTouch* props)
  // because React binds touch handlers as passive by default in most browsers,
  // which silently ignores preventDefault() and lets the page scroll while drawing.
  useEffect(() => {
    const canvas = canvasRef.current;
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", end, { passive: false });
    canvas.addEventListener("touchcancel", end, { passive: false });
    return () => {
      canvas.removeEventListener("touchstart", start);
      canvas.removeEventListener("touchmove", move);
      canvas.removeEventListener("touchend", end);
      canvas.removeEventListener("touchcancel", end);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = getCtx();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    hasStroke.current = false;
    setEmpty(true);
  };

  const save = () => {
    if (empty) return;
    onSave(canvasRef.current.toDataURL("image/png"));
  };

  const fileInputRef = useRef(null);

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = canvasRef.current;
        const ctx = getCtx();
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // encaixa a imagem mantendo proporção, centralizada
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        hasStroke.current = true;
        setEmpty(false);
        onSave(canvas.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        width={520}
        height={140}
        style={{
          width: "100%",
          height: 120,
          borderRadius: 4,
          border: `1.5px dashed #C7CDD9`,
          touchAction: "none",
          cursor: "crosshair",
          background: "#fff",
        }}
        onMouseDown={start}
        onMouseMove={move}
        onMouseUp={end}
        onMouseLeave={end}
      />
      <input
        ref={fileInputRef}
        type="file"
        accept="image/*"
        style={{ display: "none" }}
        onChange={handleFile}
      />
      <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
        <button className="btn-ghost" onClick={clear} type="button">Limpar</button>
        <button className="btn-ghost" onClick={() => fileInputRef.current.click()} type="button">
          Usar foto salva
        </button>
        <button className="btn-ink" onClick={save} type="button" disabled={empty}>Salvar assinatura</button>
      </div>
    </div>
  );
}

              CPF: {seller.cpf || "___.___.___-__"}

      </div>

  );
}

          {/* RIGHT: preview */}
          <div>
            <div className="card" style={{ padding: 0, overflow: "hidden", boxShadow: "0 1px 3px rgba(15,30,61,.06), 0 10px 24px rgba(15,30,61,.06)" }}>
              <ReceiptDocument seller={seller} form={form} signature={signature} numeroRecibo={numeroRecibo} valorReais={valorReais} />
            </div>

            <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 14 }}>
              <button className="btn-ghost" onClick={() => window.print()} type="button">
                Imprimir / Salvar como PDF
              </button>
            </div>

            {receipts.length > 0 && (
              <div style={{ marginTop: 30 }}>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 600, color: TOKENS.ink, marginBottom: 10 }}>
                  Recibos anteriores
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {receipts.map((r) => (
                    <div key={r.id} className="card" style={{ padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ color: TOKENS.ink, fontSize: 13.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                          {r.payerName} — R$ {r.value.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}
                        </div>
                        <div style={{ color: TOKENS.inkMuted, fontSize: 12 }}>{r.description} · {formatDatePtBR(r.date)}</div>
                      </div>
                      <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                        <button className="btn-ghost" style={{ padding: "6px 10px", fontSize: 12 }} onClick={() => loadReceiptIntoForm(r)} type="button">Reabrir</button>
                        <button className="btn-ghost" style={{ padding: "6px 10px", fontSize: 12, color: TOKENS.danger, borderColor: `${TOKENS.danger}55` }} onClick={() => handleDeleteReceipt(r.id)} type="button">Excluir</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>

      <div id="print-area" className="print-only">
        <ReceiptDocument seller={seller} form={form} signature={signature} numeroRecibo={numeroRecibo} valorReais={valorReais} />
      </div>
    </div>
  );
}

try {
  const rootEl = document.getElementById("root");
  ReactDOM.createRoot(rootEl).render(<App />);
} catch (err) {
  const box = document.getElementById("boot-error");
  if (box) {
    box.style.display = "block";
    box.textContent = "Deu um erro ao iniciar o app:\n" + (err && err.message ? err.message : String(err));
  }
}
</script>
</body>
</html>
