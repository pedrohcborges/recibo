  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");

    box.style.display = "block";
    box.textContent = "Deu um erro ao carregar o app:\n" + (e.message || e.error || "erro desconhecido") +

<script>
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem("recibo-app:" + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem("recibo-app:" + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem("recibo-app:" + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const p = "recibo-app:" + (prefix || "");
      const keys = Object.keys(localStorage)
        .filter((k) => k.startsWith(p))
        .map((k) => k.slice("recibo-app:".length));
      return { keys, prefix: prefix || null, shared: false };
    },
  };
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const UNIDADES = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove"];
const DEZ_A_DEZENOVE = ["dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const DEZENAS = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CENTENAS = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function tresDigitos(n) {
  if (n === 0) return "";
  if (n === 100) return "cem";
  const c = Math.floor(n / 100);
  const resto = n % 100;
  const partes = [];
  if (c > 0) partes.push(CENTENAS[c]);
  if (resto > 0) {
    if (resto < 10) partes.push(UNIDADES[resto]);
    else if (resto < 20) partes.push(DEZ_A_DEZENOVE[resto - 10]);
    else {
      const d = Math.floor(resto / 10);
      const u = resto % 10;
      partes.push(u > 0 ? `${DEZENAS[d]} e ${UNIDADES[u]}` : DEZENAS[d]);
    }
  }
  return partes.join(" e ");
}
function numeroPorExtenso(num) {
  if (num === 0) return "zero";
  const milhar = Math.floor(num / 1000);
  const resto = num % 1000;
  const partes = [];
  if (milhar > 0) partes.push(milhar === 1 ? "mil" : `${tresDigitos(milhar)} mil`);
  if (resto > 0) partes.push(tresDigitos(resto));
  const juntor = milhar > 0 && resto > 0 && resto < 100 ? " e " : " ";
  return partes.join(juntor);
}
function valorPorExtenso(valor) {
  const inteiro = Math.floor(valor);
  const centavos = Math.round((valor - inteiro) * 100);
  let texto = `${numeroPorExtenso(inteiro)} ${inteiro === 1 ? "real" : "reais"}`;
  if (centavos > 0) {
    texto += ` e ${numeroPorExtenso(centavos)} ${centavos === 1 ? "centavo" : "centavos"}`;
  }
  return texto;
}
function maskCPF(v) {
  v = v.replace(/\D/g, "").slice(0, 11);
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  return v;
}
function centsToBRL(cents) {
  return (cents / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDatePtBR(isoDate) {
  if (!isoDate) return "";
  const [y, m, d] = isoDate.split("-").map(Number);
  return `${d} de ${MESES[m - 1]} de ${y}`;
}
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function SignaturePad({ initialDataUrl, onSave, ink }) {
  const canvasRef = useRef(null);

  const getCtx = () => canvasRef.current.getContext("2d");
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = getCtx();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (initialDataUrl) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = initialDataUrl;
    }
  }, []);
  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return {
      x: ((point.clientX - rect.left) / rect.width) * canvasRef.current.width,
      y: ((point.clientY - rect.top) / rect.height) * canvasRef.current.height,

  };
  const start = (e) => {
    if (e.cancelable) e.preventDefault();
    drawing.current = true;
    hasStroke.current = true;
    setEmpty(false);
    const { x, y } = pos(e);
    const ctx = getCtx();
    ctx.beginPath();
    ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    if (e.cancelable) e.preventDefault();
    const { x, y } = pos(e);
    const ctx = getCtx();
    ctx.lineTo(x, y);
    ctx.stroke();
  };
  const end = (e) => {
    if (e && e.cancelable) e.preventDefault();
    drawing.current = false;
  };

    const canvas = canvasRef.current;
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", end, { passive: false });
    canvas.addEventListener("touchcancel", end, { passive: false });
    return () => {
      canvas.removeEventListener("touchstart", start);
      canvas.removeEventListener("touchmove", move);
      canvas.removeEventListener("touchend", end);
      canvas.removeEventListener("touchcancel", end);
    };
  }, []);
  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = getCtx();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    hasStroke.current = false;
    setEmpty(true);
  };
  const save = () => {
    if (empty) return;
    onSave(canvasRef.current.toDataURL("image/png"));
  };
  const fileInputRef = useRef(null);
  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = canvasRef.current;
        const ctx = getCtx();

        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        hasStroke.current = true;
        setEmpty(false);
        onSave(canvas.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };
  return (
    <div>
      <canvas
        ref={canvasRef}
        width={520}
        height={140}
        style={{
          width: "100%",
          height: 120,
          borderRadius: 6,
          border: `1.5px dashed #334155`,
          touchAction: "none",
          cursor: "crosshair",
          background: "#fff",
        }}
        onMouseDown={start}
        onMouseMove={move}
        onMouseUp={end}
        onMouseLeave={end}

      <input
        ref={fileInputRef}
        type="file"
        accept="image/*"
        style={{ display: "none" }}
        onChange={handleFile}
      />
      <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
        <button className="btn-ghost" onClick={clear} type="button">Limpar</button>
        <button className="btn-ghost" onClick={() => fileInputRef.current.click()} type="button">Usar foto salva</button>
        <button className="btn-primary" onClick={save} type="button" disabled={empty}>Salvar assinatura</button>
      </div>
    </div>
  );
}

        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: `2px solid #0f172a`, paddingBottom: 14, marginBottom: 20 }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: ".08em", textTransform: "uppercase", color: "#64748b", fontWeight: 700, marginBottom: 4 }}>
              Recibo de pagamento
            </div>
            <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: "#64748b" }}>
              Nº {numeroRecibo}
            </div>
          </div>
          <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 18, fontWeight: 700, background: "#f0f9ff", color: "#0284c7", borderRadius: 6, padding: "6px 12px" }}>
            {valorReais ? `R$ ${centsToBRL(parseInt(form.valueCents || "0", 10))}` : "R$ 0,00"}
          </div>
        </div>
        <p style={{ fontSize: 15, lineHeight: 1.75, margin: "0 0 14px" }}>
          Recebi de <strong>{form.payerName || "________________"}</strong> — CPF{" "}
          <span style={{ fontFamily: "'Space Mono', monospace" }}>{form.payerCpf || "___.___.___-__"}</span>, a
          importância de{" "}
          <strong>{valorReais ? valorPorExtenso(valorReais) : "________________"}</strong>, referente a{" "}
          <strong>{form.description || "________________"}</strong>.
        </p>
        <p style={{ fontSize: 15, lineHeight: 1.75, margin: "0 0 14px" }}>
          Para maior clareza, firmo o presente recibo, que comprova o recebimento integral do valor
          mencionado, concedendo <strong>quitação plena, geral e irrevogável</strong> pela quantia recebida.
        </p>
        {seller.pix && (
          <p style={{ fontSize: 13.5, color: "#64748b", margin: "0 0 22px" }}>
            Pagamento recebido através da chave Pix: {seller.pix}
          </p>
        )}
        <div style={{ textAlign: "right", fontSize: 14, color: "#64748b", marginBottom: 26 }}>
          {seller.cidade || "________"}, {formatDatePtBR(form.date)}
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginTop: 10 }}>
          {signature ? (
            <img src={signature} alt="Assinatura" style={{ height: 54, marginBottom: -6 }} />
          ) : (
            <div style={{ height: 54 }} />
          )}
          <div style={{ width: 260, borderTop: `1.5px solid #0f172a`, marginTop: 6, paddingTop: 8, textAlign: "center" }}>
            <div style={{ fontWeight: 700, fontSize: 14 }}>{seller.nome || "________________"}</div>
            <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: "#64748b" }}>
              CPF: {seller.cpf || "___.___.___-__"}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
const TOKENS = {
  bg: "#0f172a",
  card: "#1e293b",
  ink: "#f8fafc",
  inkMuted: "#94a3b8",
  accent: "#38bdf8",
  line: "#334155",
  danger: "#f87171",
  dangerSoft: "#450a0a",
  success: "#34d399",
  successSoft: "#064e3b",
};
function App() {
  const [ready, setReady] = useState(false);
  const [seller, setSeller] = useState({ nome: "", cpf: "", cidade: "", pix: "" });
  const [sellerSavedNote, setSellerSavedNote] = useState("");
  const [signature, setSignature] = useState(null);
  const [receipts, setReceipts] = useState([]);
  const [form, setForm] = useState({
    payerName: "",
    payerCpf: "",
    description: "",
    valueCents: "",
    date: todayISO(),
  });
  const [savedFlash, setSavedFlash] = useState("");
  const [error, setError] = useState("");
  useEffect(() => {
    (async () => {
      try {
        const [s, sig, rec] = await Promise.allSettled([
          window.storage.get("seller-data", false),
          window.storage.get("signature", false),
          window.storage.get("receipts", false),
        ]);
        if (s.status === "fulfilled" && s.value) setSeller(JSON.parse(s.value.value));
        if (sig.status === "fulfilled" && sig.value) setSignature(sig.value.value);
        if (rec.status === "fulfilled" && rec.value) setReceipts(JSON.parse(rec.value.value));
      } catch (e) {
      } finally {
        setReady(true);
      }
    })();
  }, []);
  const saveSeller = useCallback(async (next) => {
    setSeller(next);
    try {
      await window.storage.set("seller-data", JSON.stringify(next), false);
      setSellerSavedNote("Salvo");
      setTimeout(() => setSellerSavedNote(""), 1400);
    } catch (e) {
      setSellerSavedNote("Falha ao salvar");
    }
  }, []);
  const saveSignature = useCallback(async (dataUrl) => {
    setSignature(dataUrl);
    try {
      await window.storage.set("signature", dataUrl, false);
      setSavedFlash("Assinatura salva");
      setTimeout(() => setSavedFlash(""), 1600);
    } catch (e) {
      setError("Não foi possível salvar a assinatura.");
    }
  }, []);
  const valorReais = form.valueCents ? parseInt(form.valueCents, 10) / 100 : 0;
  const handleGerar = async () => {
    setError("");
    if (!seller.nome || !seller.cpf) {
      setError("Preencha seu nome e CPF em “Seus dados” antes de gerar o recibo.");
      return;
    }
    if (!signature) {
      setError("Salve sua assinatura antes de gerar o recibo.");
      return;
    }
    if (!form.payerName || !form.payerCpf || !form.description || !valorReais) {
      setError("Preencha nome do pagador, CPF, produto/serviço e valor.");
      return;
    }
    const novo = {
      id: Date.now().toString(36),
      payerName: form.payerName,
      payerCpf: form.payerCpf,
      description: form.description,
      value: valorReais,
      date: form.date,
      seller: { ...seller },
      signature,
      createdAt: new Date().toISOString(),
    };
    const next = [novo, ...receipts];
    setReceipts(next);
    try {
      await window.storage.set("receipts", JSON.stringify(next), false);
      setSavedFlash("Recibo salvo no histórico");
      setTimeout(() => setSavedFlash(""), 1800);
    } catch (e) {
      setError("Recibo gerado, mas não consegui salvar no histórico.");
    }
  };
  const handleDeleteReceipt = async (id) => {
    const next = receipts.filter((r) => r.id !== id);
    setReceipts(next);
    try {
      await window.storage.set("receipts", JSON.stringify(next), false);
    } catch (e) {}
  };
  const loadReceiptIntoForm = (r) => {
    setForm({
      payerName: r.payerName,
      payerCpf: r.payerCpf,
      description: r.description,
      valueCents: String(Math.round(r.value * 100)),
      date: r.date,
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const numeroRecibo = String(receipts.length + 1).padStart(4, "0");
  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: TOKENS.bg, color: TOKENS.inkMuted, fontFamily: "Inter, sans-serif" }}>
        Carregando seus dados…
      </div>
    );
  }
  return (
    <div className="app-wrapper" style={{ minHeight: "100vh", background: TOKENS.bg, fontFamily: "'Inter', sans-serif", color: TOKENS.ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        input, textarea { font-family: 'Inter', sans-serif; }
        input:focus, textarea:focus, canvas:focus {
          outline: 2px solid ${TOKENS.accent};
          outline-offset: 1px;
        }
        .field-label {
          font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
          color: ${TOKENS.inkMuted}; font-weight: 600; margin-bottom: 4px; display: block;
        }
        .field-input {
          width: 100%; padding: 9px 11px; border-radius: 6px;
          border: 1.5px solid ${TOKENS.line}; background: #0f172a;
          font-size: 14.5px; color: ${TOKENS.ink};
        }
        .field-input::placeholder { color: #475569; }
        .btn-ghost {
          background: transparent; color: ${TOKENS.inkMuted}; border: 1.5px solid ${TOKENS.line};
          border-radius: 6px; padding: 10px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer;
        }
        .btn-ghost:hover { color: ${TOKENS.ink}; border-color: ${TOKENS.accent}; }
        .btn-primary {
          background: ${TOKENS.accent}; color: #0f172a; border: none; border-radius: 6px;
          padding: 11px 20px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
        .card {
          background: ${TOKENS.card}; border: 1px solid ${TOKENS.line}; border-radius: 10px; padding: 18px;
        }
        .print-only { display: none; }
        @media print {
          .screen-only { display: none !important; }
          .print-only { display: block !important; }
          .app-wrapper { background: #fff !important; min-height: 0 !important; }
          html, body { background: #fff !important; }
          @page { margin: 15mm; }
        }
        @media (max-width: 860px) {
          .layout { grid-template-columns: 1fr !important; }
        }
      `}</style>
      <div id="app-chrome" className="screen-only" style={{ maxWidth: 1080, margin: "0 auto", padding: "28px 20px 60px" }}>
        <header style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 26, fontWeight: 700, color: TOKENS.ink }}>
            Gerador de Recibos
          </div>
          <div style={{ color: TOKENS.inkMuted, fontSize: 13.5, marginTop: 3 }}>
            Seus dados e sua assinatura ficam salvos no aparelho — só preencha os dados do pagador.
          </div>
        </header>
        {error && (
          <div style={{ background: TOKENS.dangerSoft, color: TOKENS.danger, border: `1px solid ${TOKENS.danger}33`, borderRadius: 8, padding: "10px 14px", fontSize: 13.5, marginBottom: 16 }}>
            {error}
          </div>
        )}
        {savedFlash && (
          <div style={{ background: TOKENS.successSoft, color: TOKENS.success, border: `1px solid ${TOKENS.success}33`, borderRadius: 8, padding: "10px 14px", fontSize: 13.5, marginBottom: 16 }}>
            {savedFlash}
          </div>
        )}
        <div className="layout" style={{ display: "grid", gridTemplateColumns: "380px 1fr", gap: 22, alignItems: "start" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <section className="card">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <div style={{ fontSize: 16, fontWeight: 600, color: TOKENS.ink }}>Seus dados</div>
                <span style={{ fontSize: 11, color: TOKENS.success, minHeight: 14 }}>{sellerSavedNote}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div>
                  <label className="field-label">Seu nome</label>
                  <input className="field-input" value={seller.nome}
                    onChange={(e) => setSeller({ ...seller, nome: e.target.value })}
                    onBlur={() => saveSeller(seller)} placeholder="Nome completo" />
                </div>
                <div>
                  <label className="field-label">Seu CPF</label>
                  <input className="field-input" value={seller.cpf}
                    onChange={(e) => setSeller({ ...seller, cpf: maskCPF(e.target.value) })}
                    onBlur={() => saveSeller(seller)} placeholder="000.000.000-00" inputMode="numeric" />
                </div>
                <div>
                  <label className="field-label">Cidade</label>
                  <input className="field-input" value={seller.cidade}
                    onChange={(e) => setSeller({ ...seller, cidade: e.target.value })}
                    onBlur={() => saveSeller(seller)} placeholder="Erechim" />
                </div>
                <div>
                  <label className="field-label">Chave Pix (opcional)</label>
                  <input className="field-input" value={seller.pix}
                    onChange={(e) => setSeller({ ...seller, pix: e.target.value })}
                    onBlur={() => saveSeller(seller)} placeholder="CPF, e-mail, telefone..." />
                </div>
              </div>
            </section>
            <section className="card">
              <div style={{ fontSize: 16, fontWeight: 600, color: TOKENS.ink, marginBottom: 10 }}>
                Sua assinatura
              </div>
              <SignaturePad initialDataUrl={signature} onSave={saveSignature} ink="#0f172a" />
            </section>
            <section className="card">
              <div style={{ fontSize: 16, fontWeight: 600, color: TOKENS.ink, marginBottom: 12 }}>
                Novo recibo
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div>
                  <label className="field-label">Nome de quem vai pagar</label>
                  <input className="field-input" value={form.payerName}
                    onChange={(e) => setForm({ ...form, payerName: e.target.value })} placeholder="Nome do pagador" />
                </div>
                <div>
                  <label className="field-label">CPF de quem vai pagar</label>
                  <input className="field-input" value={form.payerCpf}
                    onChange={(e) => setForm({ ...form, payerCpf: maskCPF(e.target.value) })} placeholder="000.000.000-00" inputMode="numeric" />
                </div>
                <div>
                  <label className="field-label">Produto / serviço</label>
                  <input className="field-input" value={form.description}
                    onChange={(e) => setForm({ ...form, description: e.target.value })} placeholder="Ex: Suporte iPad" />
                </div>
                <div>
                  <label className="field-label">Valor (R$)</label>
                  <input className="field-input" value={form.valueCents ? centsToBRL(parseInt(form.valueCents, 10)) : ""}
                    onChange={(e) => setForm({ ...form, valueCents: e.target.value.replace(/\D/g, "") })}
                    placeholder="0,00" inputMode="numeric" />
                </div>
                <div>
                  <label className="field-label">Data</label>
                  <input className="field-input" type="date" value={form.date} style={{ colorScheme: "dark" }}
                    onChange={(e) => setForm({ ...form, date: e.target.value })} />
                </div>
                <button className="btn-primary" onClick={handleGerar} type="button" style={{ marginTop: 4 }}>
                  Gerar e salvar recibo
                </button>
              </div>
            </section>
          </div>
          <div>
            <div className="card" style={{ padding: 0, overflow: "hidden", boxShadow: "0 10px 25px -5px rgba(0,0,0,0.5)" }}>
              <ReceiptDocument seller={seller} form={form} signature={signature} numeroRecibo={numeroRecibo} valorReais={valorReais} />
            </div>
            <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 14 }}>
              <button className="btn-ghost" onClick={() => window.print()} type="button">
                Imprimir / Salvar como PDF
              </button>
            </div>
            {receipts.length > 0 && (
              <div style={{ marginTop: 30 }}>
                <div style={{ fontSize: 16, fontWeight: 600, color: TOKENS.ink, marginBottom: 10 }}>
                  Recibos anteriores
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {receipts.map((r) => (
                    <div key={r.id} className="card" style={{ padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ color: TOKENS.ink, fontSize: 13.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                          {r.payerName} — R$ {r.value.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}
                        </div>
                        <div style={{ color: TOKENS.inkMuted, fontSize: 12 }}>{r.description} · {formatDatePtBR(r.date)}</div>
                      </div>
                      <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                        <button className="btn-ghost" style={{ padding: "6px 10px", fontSize: 12 }} onClick={() => loadReceiptIntoForm(r)} type="button">Reabrir</button>
                        <button className="btn-ghost" style={{ padding: "6px 10px", fontSize: 12, color: TOKENS.danger, borderColor: `${TOKENS.danger}55` }} onClick={() => handleDeleteReceipt(r.id)} type="button">Excluir</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
      <div id="print-area" className="print-only">
        <ReceiptDocument seller={seller} form={form} signature={signature} numeroRecibo={numeroRecibo} valorReais={valorReais} />
      </div>
    </div>
  );
}
try {
  const rootEl = document.getElementById("root");
  ReactDOM.createRoot(rootEl).render(<App />);
} catch (err) {
  const box = document.getElementById("boot-error");
  if (box) {
    box.style.display = "block";
    box.textContent = "Deu um erro ao iniciar o app:\n" + (err && err.message ? err.message : String(err));
  }
}
</script>
</body>
</html>
